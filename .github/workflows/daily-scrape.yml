# Automated Daily Scrape + Site Rebuild
#
# What this file does, in plain English:
#   Every day at the scheduled time, GitHub spins up a free temporary
#   computer, downloads your code, runs your scraper, cleans the data,
#   rebuilds your website, and publishes it - all with your laptop
#   completely closed. You will never manually run these commands again
#   once this is set up correctly on GitHub.
#
# You do not need to understand YAML syntax to use this. Just follow the
# setup steps in the README section about hosting.

name: Daily Scrape and Site Update

on:
  schedule:
    # Runs at 05:00 UTC every day, which is 08:00 in Kenya (EAT, UTC+3).
    # Cron format is "minute hour day month weekday" - this means
    # "at minute 0, hour 5, every day, every month, every weekday".
    - cron: "0 5 * * *"
  # This lets you also trigger a run manually from the GitHub website,
  # any time you want, without waiting for the schedule - useful for
  # testing that everything works before you trust the automatic schedule.
  workflow_dispatch:

# Gives the automated run permission to save (commit) updated data back
# into your repository - needed so listings.db keeps growing over time
# instead of resetting every single day.
permissions:
  contents: write

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out your code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install the Chromium browser for Playwright
        run: playwright install --with-deps chromium

      - name: Run the scraper
        run: python main.py

      - name: Clean the scraped data
        run: python site_data.py

      - name: Build the website pages
        run: python generate_site.py

      - name: Save the updated database back to the repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily scrape update"
          file_pattern: listings.db

      - name: Publish the website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
